# =============================================================================
# DEVELOPMENT ONLY — TEMPORARY — WILL BE REMOVED AFTER GITLAB MIGRATION
# -----------------------------------------------------------------------------
# This GitHub Pages workflow exists purely for development-phase previews.
# The single source of production truth is GitLab Pages (.gitlab-ci.yml) on the
# custom domain https://abhayaallergycenter.com/.
# GitHub and GitLab must NOT become competing production deployments: once the
# GitLab migration is approved, delete this file. See docs/DEPLOYMENT.md.
# =============================================================================
name: Deploy to GitHub Pages (DEV PREVIEW — TEMPORARY)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
